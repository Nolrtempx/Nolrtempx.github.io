<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIRTEMPX — LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080a;
    --panel:#111114;
    --panel-2:#17171b;
    --ink:#f2f2f4;
    --ink-dim:#8e8e96;
    --line:rgba(255,255,255,0.08);
    --accent:#ff2438;
    --accent-2:#ff5a3c;
    --accent-dim:#5c0d14;
    --glow:rgba(255,36,56,0.45);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  .bg-photo{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-photo img{
    position:absolute;
    top:50%;left:50%;
    width:140%;height:140%;
    object-fit:cover;
    transform:translate(-50%,-50%) rotate(0deg);
    filter:blur(6px) brightness(0.42) saturate(1.05);
    animation:bgspin 90s linear infinite;
  }
  @keyframes bgspin{to{transform:translate(-50%,-50%) rotate(360deg);}}

  .bg-layer{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    z-index:1;
    pointer-events:none;
    background:
      repeating-linear-gradient(115deg, rgba(255,36,56,0.05) 0px, rgba(255,36,56,0.05) 2px, transparent 2px, transparent 68px),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 34px),
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,36,56,0.16), transparent 60%),
      radial-gradient(ellipse 60% 30% at 15% 60%, rgba(255,36,56,0.08), transparent 60%),
      radial-gradient(ellipse 60% 30% at 90% 85%, rgba(255,36,56,0.08), transparent 60%),
      rgba(8,8,10,0.55);
  }
  .bg-layer::after{
    content:"";
    position:absolute;top:0;left:0;right:0;bottom:0;
    background-image:radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:26px 26px;
    mix-blend-mode:overlay;
  }

  .wrap{
    position:relative;z-index:2;
    max-width:480px;
    margin:0 auto;
    padding:52px 20px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .brand-ring{
    width:150px;height:150px;
    border-radius:50%;
    padding:5px;
    background:conic-gradient(from 0deg, var(--accent), #ffb199, var(--accent-2), var(--accent-dim), var(--accent));
    box-shadow:0 18px 44px -14px rgba(0,0,0,0.85), 0 0 44px -8px var(--glow);
    animation:ringspin 12s linear infinite;
    margin-bottom:18px;
  }
  @keyframes ringspin{to{transform:rotate(360deg);}}
  .brand-ring-inner{
    width:100%;height:100%;
    border-radius:50%;
    overflow:hidden;
    border:3px solid #08080a;
  }
  .brand-ring-inner img{width:100%;height:100%;object-fit:cover;display:block;}

  .brand-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:34px;
    letter-spacing:3px;
    margin:0 0 4px;
    text-align:center;
  }
  .brand-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:1px;
    margin-bottom:34px;
    text-align:center;
  }

  .link-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .link-tile{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 18px 12px 12px;
    text-decoration:none;
    color:var(--ink);
    background:linear-gradient(165deg, var(--panel-2) 0%, var(--panel) 55%, #0a0a0c 100%);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -1px 0 rgba(0,0,0,0.4),
      0 16px 34px -16px rgba(0,0,0,0.85);
    transition:transform .18s, border-color .18s, box-shadow .18s;
  }
  .link-tile:active{transform:scale(0.98);}
  .link-tile:hover{
    border-color:var(--accent);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -1px 0 rgba(0,0,0,0.4),
      0 16px 34px -16px rgba(0,0,0,0.85),
      0 0 26px -6px var(--glow);
  }
  .link-tile .thumb{
    width:56px;height:56px;
    border-radius:50%;
    overflow:hidden;
    flex:none;
    border:2px solid rgba(255,255,255,0.12);
  }
  .link-tile .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .link-tile .text{flex:1;min-width:0;}
  .link-tile .name{
    font-family:'Bebas Neue',sans-serif;
    font-size:19px;
    letter-spacing:1px;
    line-height:1.2;
  }
  .link-tile .handle{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .link-tile .arrow{
    flex:none;
    width:16px;height:16px;
    stroke:var(--ink-dim);
  }
  .link-tile:hover .arrow{stroke:var(--accent);}

  .foot-note{
    margin-top:36px;
    font-size:11.5px;
    color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;
    text-align:center;
  }

  /* ---------- slide to pay ---------- */
  .slide-wrap{
    width:100%;
    margin-top:30px;
  }
  .slide-track{
    position:relative;
    width:100%;
    height:60px;
    border-radius:30px;
    background:linear-gradient(165deg, var(--panel-2) 0%, var(--panel) 60%, #0a0a0c 100%);
    border:1px solid var(--line);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -1px 0 rgba(0,0,0,0.4),
      0 16px 34px -16px rgba(0,0,0,0.85);
    overflow:hidden;
    touch-action:none;
    user-select:none;
  }
  .slide-fill{
    position:absolute;
    top:0;left:0;bottom:0;
    width:60px;
    border-radius:30px;
    background:linear-gradient(180deg, var(--accent-2), var(--accent) 70%, #b3121f);
    box-shadow:0 0 24px -4px var(--glow);
    transition:width .05s linear;
  }
  .slide-label{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Bebas Neue',sans-serif;
    font-size:16px;
    letter-spacing:1.5px;
    color:var(--ink-dim);
    pointer-events:none;
    gap:8px;
  }
  .slide-label svg{width:16px;height:16px;stroke:var(--ink-dim);animation:chevpulse 1.6s ease-in-out infinite;}
  @keyframes chevpulse{0%,100%{opacity:.4;transform:translateX(0);}50%{opacity:1;transform:translateX(4px);}}
  .slide-handle{
    position:absolute;
    top:4px;left:4px;
    width:52px;height:52px;
    border-radius:50%;
    background:linear-gradient(180deg, #fff, #d8d8d8);
    box-shadow:0 6px 16px -4px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    z-index:2;
  }
  .slide-handle:active{cursor:grabbing;}
  .slide-handle svg{width:20px;height:20px;stroke:#111;}
  .slide-caption{
    text-align:center;
    margin-top:10px;
    font-size:11.5px;
    color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;
  }

  @media (prefers-reduced-motion: reduce){
    .bg-photo img, .brand-ring{animation:none;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="bg-photo"><img src="assets/profile.png" alt=""></div>
<div class="bg-layer"></div>

<div class="wrap">

  <div class="brand-ring">
    <div class="brand-ring-inner">
      <img src="assets/profile.png" alt="NoirTempX">
    </div>
  </div>
  <div class="brand-title">NOIRTEMPX</div>
  <div class="brand-sub">choose a platform below</div>

  <div class="link-list">

    <a class="link-tile" href="https://x.com/artter92" target="_blank" rel="noopener">
      <div class="thumb"><img src="assets/link-noirtempx.png" alt="NoirTempX"></div>
      <div class="text">
        <div class="name">NoirTempX</div>
        <div class="handle">x.com/artter92</div>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>

    <a class="link-tile" href="https://x.com/Tengnueng1989" target="_blank" rel="noopener">
      <div class="thumb"><img src="assets/link-tengnueng.png" alt="Tengnueng"></div>
      <div class="text">
        <div class="name">Tengnueng</div>
        <div class="handle">x.com/Tengnueng1989</div>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>

    <a class="link-tile" href="https://x.com/artter_1992" target="_blank" rel="noopener">
      <div class="thumb"><img src="assets/link-artter.png" alt="artter"></div>
      <div class="text">
        <div class="name">artter</div>
        <div class="handle">x.com/artter_1992</div>
      </div>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>

    <a class="link-tile" href="https://www.instagram.com/artter1992" target="_blank" rel="noopener">
      <div class="thumb"><img src="assets/link-instagram.png" alt="Instagram"></div>
      <div class="text">
        <div class="name">Instagram</div>

      </div>

    <a class="link-tile" href="https://www.tiktok.com/@norlter" target="_blank" rel="noopener">
      <div class="thumb"><img src="assets/link-tiktok.png" alt="TikTok"></div>
      <div class="text">
        <div class="name">TikTok</div>

  <div class="foot-note">create your own path</div>

  <div class="slide-wrap">
    <div class="slide-track" id="slideTrack">
      <div class="slide-fill" id="slideFill"></div>
      <div class="slide-label">
        เลื่อนเพื่อชำระเงินในขั้นตอนต่อไป
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="slide-handle" id="slideHandle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
    <div class="slide-caption">ปัดขวาเพื่อไปหน้าชำระเงิน</div>
  </div>

</div>

<script>
(function(){
  const track = document.getElementById('slideTrack');
  const handle = document.getElementById('slideHandle');
  const fill = document.getElementById('slideFill');
  let dragging = false, startX = 0, maxX = 0;

  function setup(){ maxX = track.offsetWidth - handle.offsetWidth - 8; }
  setup();
  window.addEventListener('resize', setup);

  function pointerX(e){ return (e.touches ? e.touches[0].clientX : e.clientX); }

  function onStart(e){
    dragging = true;
    startX = pointerX(e) - handle.offsetLeft;
    handle.style.transition = 'none';
    fill.style.transition = 'none';
  }
  function onMove(e){
    if(!dragging) return;
    let x = pointerX(e) - startX;
    x = Math.max(4, Math.min(maxX, x));
    handle.style.left = x + 'px';
    fill.style.width = (x + handle.offsetWidth) + 'px';
    if(x >= maxX - 2){
      dragging = false;
      window.location.href = 'profile.html#payment';
    }
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    handle.style.transition = 'left .25s ease';
    fill.style.transition = 'width .25s ease';
    handle.style.left = '4px';
    fill.style.width = '60px';
  }

  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, {passive:true});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:true});
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchend', onEnd);
})();
</script>
